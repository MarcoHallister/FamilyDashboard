/* --- Großer Kalender mit Monats- und Wochenansicht --- */
function weekRangeText(ws) {
  var we = addDays(ws, 6), a = ws.split('-'), b = we.split('-');
  if (a[1] === b[1]) return +a[2] + '.–' + +b[2] + '. ' + MON3[+b[1] - 1] + ' ' + b[0];
  return +a[2] + '. ' + MON3[+a[1] - 1] + ' – ' + +b[2] + '. ' + MON3[+b[1] - 1] + ' ' + b[0];
}
function layoutLanes(items) {
  var lanes = [], cluster = [], clusterEnd = 0, res = [];
  function flush() { var n = lanes.length; cluster.forEach(function (c) { c.n = n; }); res = res.concat(cluster); lanes = []; cluster = []; }
  items.forEach(function (it) {
    if (cluster.length && it.s >= clusterEnd) flush();
    var li = 0;
    while (li < lanes.length && lanes[li] > it.s) li++;
    lanes[li] = it.e; it.lane = li; cluster.push(it);
    clusterEnd = Math.max(clusterEnd, it.e);
  });
  flush();
  return res;
}

function openCalendar() {
  var m = openModal('cal');
  m.dlg.parentNode.style.padding = '0';
  var st = { view: cal.cfg.view, anchor: ui.today, scroll: -1 };
  var barEl = h('div', { class: 'calbar' }), bodyEl = h('div', { class: 'calbody' });
  m.dlg.appendChild(barEl); m.dlg.appendChild(bodyEl);

  function narrow() { return $('app').clientWidth < 700; }
  function rangeOf() {
    var p = st.anchor.split('-'), y = +p[0], mo = +p[1];
    if (st.view === 'month') {
      var first = ymd(y, mo, 1), last = ymd(y, mo, daysInMonth(y, mo));
      return { from: weekStart(first), to: addDays(weekStart(last), 6) };
    }
    var ws = weekStart(st.anchor);
    return { from: ws, to: addDays(ws, 6) };
  }
  function titleText() {
    var p = st.anchor.split('-');
    return st.view === 'month' ? MONTHS[+p[1] - 1] + ' ' + p[0] : 'KW ' + isoWeek(weekStart(st.anchor)) + ' · ' + weekRangeText(weekStart(st.anchor));
  }
  function move(dir) {
    var p = st.anchor.split('-');
    if (st.view === 'month') {
      var mm0 = (+p[1] - 1) + dir, y = +p[0] + Math.floor(mm0 / 12), mo = ((mm0 % 12) + 12) % 12 + 1;
      st.anchor = ymd(y, mo, 1);
    } else st.anchor = addDays(st.anchor, dir * 7);
    st.scroll = -1;
    render();
  }
  function close() { var i = cal.views.indexOf(renderContent); if (i >= 0) cal.views.splice(i, 1); m.close(); }
  function setView(v) { st.view = v; cal.cfg.view = v; calSaveCfg(); st.scroll = -1; render(); }

  function buildBar() {
    barEl.innerHTML = '';
    appendKids(barEl, [
      h('div', { class: 'calnav' }, [
        h('button', { class: 'btn calprev', 'aria-label': 'Zurück', onclick: function () { move(-1); } }, '◀'),
        h('button', { class: 'btn caltoday', onclick: function () { st.anchor = ui.today; st.scroll = -1; render(); } }, 'Heute'),
        h('button', { class: 'btn calnext', 'aria-label': 'Weiter', onclick: function () { move(1); } }, '▶')
      ]),
      h('div', { class: 'caltitle2' }, titleText()),
      h('div', { class: 'calseg' }, [
        h('button', { class: 'segweek' + (st.view === 'week' ? ' on' : ''), onclick: function () { setView('week'); } }, 'Woche'),
        h('button', { class: 'segmonth' + (st.view === 'month' ? ' on' : ''), onclick: function () { setView('month'); } }, 'Monat')
      ]),
      h('button', { class: 'calclose', 'aria-label': 'Schließen', onclick: close }, '✕')
    ]);
  }

  function monthEl() {
    var p = st.anchor.split('-'), y = +p[0], mo = +p[1], r = rangeOf();
    var weeks = (diffDays(r.to, r.from) + 1) / 7, nar = narrow(), byDate = {};
    calExpand(cal.raws, r.from, r.to).forEach(function (ev) {
      calDatesOf(ev, r.from, r.to).forEach(function (d) { (byDate[d] = byDate[d] || []).push(ev); });
    });
    var grid = h('div', { class: 'cgrid', style: { 'grid-template-rows': 'repeat(' + weeks + ',minmax(0,1fr))' } });
    for (var d = r.from; d <= r.to; d = addDays(d, 1)) {
      (function (d) {
        var evs = byDate[d] || [], inMonth = +d.slice(5, 7) === mo;
        var cell = h('button', {
          class: 'cday' + (inMonth ? '' : ' out') + (d === ui.today ? ' today' : ''), 'data-date': d,
          'aria-label': DAYS_LONG[isoDay(d) - 1] + ' ' + fmtDate(d) + ', ' + evs.length + ' Termine', onclick: function () { openDayList(d); }
        }, h('span', { class: 'cnum' }, String(+d.slice(8))));
        if (nar) {
          if (evs.length) cell.appendChild(h('span', { class: 'cdots' }, evs.slice(0, 6).map(function () { return h('i', { class: 'cdot' }); })));
        } else {
          var max = weeks > 5 ? 2 : 3;
          evs.slice(0, max).forEach(function (ev) {
            cell.appendChild(h('span', { class: 'cchip' + (ev.allDay ? ' all' : '') }, (ev.allDay ? '' : hhmm(ev.start) + ' ') + (ev.title || '(ohne Titel)')));
          });
          if (evs.length > max) cell.appendChild(h('span', { class: 'cmore' }, '+ ' + (evs.length - max) + ' weitere'));
        }
        grid.appendChild(cell);
      })(d);
    }
    return h('div', { class: 'cmon' }, [h('div', { class: 'cwd' }, DAYS.map(function (x) { return h('div', null, x); })), grid]);
  }

  function weekAgendaEl() {
    var r = rangeOf(), wrap = h('div', { class: 'agenda' });
    for (var d = r.from; d <= r.to; d = addDays(d, 1)) {
      var evs = calOnDate(cal.raws, d);
      wrap.appendChild(h('div', { class: 'agd' + (d === ui.today ? ' today' : ''), 'data-date': d }, DAYS_LONG[isoDay(d) - 1] + ', ' + fmtDM(d) + (d === ui.today ? ' · heute' : '')));
      if (!evs.length) wrap.appendChild(h('div', { class: 'agnone' }, '–'));
      evs.forEach(function (ev) { wrap.appendChild(calEvRow(ev, d)); });
    }
    return wrap;
  }

  function weekGridEl() {
    var r = rangeOf(), days = [], i;
    for (i = 0; i < 7; i++) days.push(addDays(r.from, i));
    var evs = calExpand(cal.raws, r.from, r.to);
    var head = h('div', { class: 'wkhead' }, [h('div')].concat(days.map(function (d, di) {
      return h('div', { class: 'whd' + (d === ui.today ? ' today' : ''), 'data-date': d }, [DAYS[di], h('b', null, String(+d.slice(8)))]);
    })));
    var allRow = h('div', { class: 'wkall' }, [h('div', { class: 'lbl2' }, 'ganztägig')].concat(days.map(function (d) {
      return h('div', null, evs.filter(function (ev) { return ev.allDay && calDatesOf(ev, d, d).length; }).map(function (ev) {
        return h('button', { class: 'cchip all', onclick: function () { openEventDetail(ev, d); } }, ev.title || '(ohne Titel)');
      }));
    })));
    var hours = h('div', { class: 'wkhours' });
    for (i = 0; i < 24; i++) hours.appendChild(h('div', null, i ? pad2(i) + ':00' : ''));
    var cols = days.map(function (d) {
      var dayStart = localMs(d), dayEnd = localMs(addDays(d, 1));
      var items = evs.filter(function (ev) { return !ev.allDay && ev.start < dayEnd && Math.max(ev.end, ev.start + 1) > dayStart; }).map(function (ev) {
        var s = Math.max(ev.start, dayStart), e = Math.min(Math.max(ev.end, ev.start + 30 * 60000), dayEnd);
        return { ev: ev, s: s, e: e };
      });
      items.sort(function (a, b) { return a.s - b.s || b.e - a.e; });
      var col = h('div', { class: 'wkcol' + (d === ui.today ? ' today' : ''), 'data-date': d });
      layoutLanes(items).forEach(function (it) {
        var top = (it.s - dayStart) / 3600000 * HOUR_H, hgt = Math.max(20, (it.e - it.s) / 3600000 * HOUR_H - 2);
        col.appendChild(h('button', {
          class: 'wev', style: { top: top + 'px', height: hgt + 'px', left: (100 * it.lane / it.n) + '%', width: 'calc(' + (100 / it.n) + '% - 2px)' },
          onclick: function () { openEventDetail(it.ev, d); }
        }, [h('b', null, it.ev.title || '(ohne Titel)'), h('span', null, hhmm(it.ev.start))]));
      });
      if (d === ui.today) col.appendChild(h('div', { class: 'nowline', style: { top: ((Date.now() - dayStart) / 3600000 * HOUR_H) + 'px' } }));
      return col;
    });
    var scroller = h('div', { class: 'wkscroll' }, h('div', { class: 'wkgrid', style: { height: (24 * HOUR_H) + 'px' } }, [hours].concat(cols)));
    return { top: [head, allRow], scroller: scroller };
  }

  function renderContent() {
    var old = bodyEl.querySelector('.wkscroll, .agenda');
    if (old) st.scroll = old.scrollTop;
    bodyEl.innerHTML = '';
    if (st.view === 'month') bodyEl.appendChild(monthEl());
    else if (narrow()) {
      var ag = weekAgendaEl();
      bodyEl.appendChild(ag);
      if (st.scroll >= 0) ag.scrollTop = st.scroll;
    } else {
      var w = weekGridEl();
      appendKids(bodyEl, w.top);
      bodyEl.appendChild(w.scroller);
      var now = new Date();
      w.scroller.scrollTop = st.scroll >= 0 ? st.scroll : Math.max(0, ((now.getHours() - 1) * HOUR_H));
      if (st.scroll < 0 && !(rangeOf().from <= ui.today && ui.today <= rangeOf().to)) w.scroller.scrollTop = 7 * HOUR_H;
    }
    var stt = calStatusText();
    if (cal.error) bodyEl.appendChild(h('div', { class: 'calfoot err' }, stt + ' – ' + cal.error));
  }
  function render() {
    buildBar();
    renderContent();
    var r = rangeOf();
    calEnsure(r.from, r.to, null);
  }
  cal.views.push(renderContent);
  render();
}

/* --- Einstellungen: Kalender verbinden --- */
function calSettingsSection(rebuild) {
  if (!calDraft) calDraft = { mode: cal.cfg.mode, url: cal.cfg.url, token: cal.cfg.token };
  var d = calDraft, urlInp = null;
  var msg = h('div', { class: 'calmsg' }, cal.cfg.mode === 'off' ? 'Kalender ist ausgeschaltet.' : calStatusText());
  var modes = [['off', 'Aus'], ['demo', 'Demo'], ['ics', 'ICS-Adresse'], ['worker', 'iCloud (Worker)']];
  var sec = h('div', { class: 'sec' }, [h('h3', null, 'Kalender (nur Anzeige)'),
    h('div', { class: 'row' }, modes.map(function (mm) {
      return h('button', { class: 'chip calmode' + (d.mode === mm[0] ? ' on' : ''), onclick: function () { d.mode = mm[0]; rebuild(); } }, mm[1]);
    }))]);
  if (d.mode === 'ics' || d.mode === 'worker') {
    urlInp = h('input', { class: 'inp calurl', type: 'url', value: d.url, placeholder: d.mode === 'worker' ? 'https://familienkalender.xxx.workers.dev' : 'https://…/kalender.ics', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false',
      oninput: function () { d.url = urlInp.value; } });
    sec.appendChild(h('label', { class: 'lbl' }, d.mode === 'worker' ? 'Adresse des Workers' : 'Adresse des Kalenders (https:// oder webcal://)'));
    sec.appendChild(urlInp);
    if (d.mode === 'worker') {
      var tokInp = h('input', { class: 'inp caltoken', type: 'password', value: d.token, placeholder: 'Zugangscode (APP_TOKEN)', autocapitalize: 'off', autocorrect: 'off',
        oninput: function () { d.token = tokInp.value; } });
      sec.appendChild(h('label', { class: 'lbl' }, 'Zugangscode'));
      sec.appendChild(tokInp);
    }
  }
  sec.appendChild(h('div', { class: 'muted', style: { 'font-size': '14px', margin: '6px 0' } },
    d.mode === 'demo' ? 'Zeigt Beispieltermine, um die Oberfläche auszuprobieren.' :
    d.mode === 'ics' ? 'Direkter Abruf. Funktioniert nur, wenn der Anbieter das Laden von anderen Seiten erlaubt (CORS).' :
    d.mode === 'worker' ? 'Der Worker liest den iCloud-Familienkalender und stellt ihn der App bereit. Einrichtung: docs/KALENDER.md' : ''));
  sec.appendChild(h('button', { class: 'btn primary calsave', onclick: function () {
    cal.cfg.mode = d.mode; cal.cfg.url = (d.mode === 'worker' || d.mode === 'ics') ? calNormUrl(d.url, d.mode === 'worker') : ''; cal.cfg.token = (d.token || '').trim();
    d.url = cal.cfg.url; if (typeof urlInp !== 'undefined' && urlInp) urlInp.value = cal.cfg.url;
    calSaveCfg(); calClearCache();
    cal.ics = []; cal.raws = []; cal.cover = null; cal.fetchedAt = 0; cal.error = '';
    renderAll();
    if (cal.cfg.mode === 'off') { msg.textContent = 'Kalender ist ausgeschaltet.'; return; }
    msg.textContent = 'Verbinde …';
    calFetch(null, null, function (err) {
      var n = calExpand(cal.raws, ui.today, addDays(ui.today, 60)).length;
      msg.textContent = err ? 'Fehler: ' + cal.error : 'Verbunden: ' + n + ' Termine in den nächsten 60 Tagen.';
    });
  } }, 'Speichern und verbinden'));
  sec.appendChild(msg);
  return sec;
}

function calInit() { calLoadCfg(); calLoadCache(); }
function calStart() {
  if (cal.cfg.mode !== 'off') calFetch(null, null);
  setInterval(function () { if (cal.cfg.mode === 'worker' || cal.cfg.mode === 'ics') calFetch(null, null); }, 600000);
  setInterval(function () { if (cal.cfg.mode !== 'off') calChanged(); }, 60000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && (cal.cfg.mode === 'worker' || cal.cfg.mode === 'ics') && Date.now() - cal.fetchedAt > 120000) calFetch(null, null);
  });
}

/* =====================================================================
   Start & Takt
   ===================================================================== */
function renderAll() { renderTabs(); renderWeekNav(); renderBoard(); renderLock(); renderBanner(); }

$('prevw').addEventListener('click', function () { var sd = curSelDay(currentWeekDates()); ui.weekOffset--; ui.selDay = addDays(sd, -7); renderWeekNav(); renderBoard(); });
$('nextw').addEventListener('click', function () { var sd = curSelDay(currentWeekDates()); ui.weekOffset++; ui.selDay = addDays(sd, 7); renderWeekNav(); renderBoard(); });
$('todayw').addEventListener('click', function () { ui.weekOffset = 0; ui.selDay = ui.today; renderWeekNav(); renderBoard(); });
$('calbtn').addEventListener('click', function () { openCalendar(); });
$('gear').addEventListener('click', function () { requirePin(openSettings, 'Einstellungen'); });

var resizeTimer = null;
window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(renderBoard, 150); });

var wasUnlocked = false;
setInterval(function () {
  var now = isUnlocked();
  if (now) renderLock();
  if (wasUnlocked && !now) onLockExpired();
  wasUnlocked = now;
  var t = todayStr();
  if (t !== ui.today) { ui.today = t; renderAll(); }   /* Tageswechsel um Mitternacht */
}, 1000);

function start(loaded) {
  data = loaded || emptyData();
  calInit();
  renderAll();
  calStart();
  if (!data.settings.pinHash) firstRun();
  else if (!data.profiles.length) renderBoard();
}

(function boot() {
  var ls = normalize(loadLS());
  idbOpen(function () {
    idbGet(function (json) {
      var fromIdb = null;
      try { fromIdb = json ? normalize(JSON.parse(json)) : null; } catch (e) { fromIdb = null; }
      var chosen = ls;
      if (fromIdb && (!ls || fromIdb.savedAt > ls.savedAt)) chosen = fromIdb;
      start(chosen);
      if (chosen && chosen === fromIdb && fromIdb !== ls) save();   /* localStorage nachziehen */
    });
  });
})();

/* Für automatisierte Tests */
window.__hp = { sha256: sha256, isDue: isDue, isoDay: isoDay, isoWeek: isoWeek, diffDays: diffDays, parseMoney: parseMoney,
  schedText: schedText, normalize: normalize, getData: function () { return data; }, balance: balance,
  cal: { normUrl: calNormUrl, parse: icsParseEvents, expand: calExpand, rrule: rruleDates, rruleParse: rruleParse, zonedToUtc: zonedToUtc, state: cal, refresh: function (cb) { calFetch(null, null, cb); } } };
})();
</script>
